services:
  jushuitan-mcp:
    build: .
    image: jushuitan-mcp:local
    container_name: jushuitan-mcp
    restart: unless-stopped
    environment:
      JST_APP_KEY: ${JST_APP_KEY:?JST_APP_KEY is required}
      JST_APP_SECRET: ${JST_APP_SECRET:?JST_APP_SECRET is required}
      JST_ENDPOINT: ${JST_ENDPOINT:-https://openapi.jushuitan.com}
      JST_TIMEOUT_SECONDS: ${JST_TIMEOUT_SECONDS:-30}
      JST_TOKEN_CACHE_PATH: /data/token.json
      JST_MCP_HOST: 0.0.0.0
      JST_MCP_PORT: 8000
      JST_MCP_PATH: ${JST_MCP_PATH:-/mcp}
    ports:
      - "${JST_MCP_BIND_ADDRESS:-127.0.0.1}:${JST_MCP_PUBLIC_PORT:-18090}:8000"
    volumes:
      - jushuitan-mcp-data:/data

volumes:
  jushuitan-mcp-data:
